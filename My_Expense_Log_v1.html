<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Expense Log</title>
<style>
  :root {
    --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#697386;
    --border:#e5e9f0; --accent:#4f46e5; --danger:#dc2626;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text);
  }
  .container { max-width:1100px; margin:0 auto; padding:28px 18px 50px; }
  h1,h2,h3,p { margin-top:0; }
  .header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
  .header h1 { margin-bottom:4px; font-size:28px; }
  .subtitle { color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px; box-shadow:0 3px 12px rgba(20,30,50,.04);
  }
  .stat-label { color:var(--muted); font-size:14px; }
  .stat-value { font-size:25px; font-weight:750; margin-top:7px; }
  .layout { display:grid; grid-template-columns:330px 1fr; gap:18px; }
  label { display:block; font-size:13px; font-weight:650; margin:0 0 6px; }
  input,select,textarea {
    width:100%; padding:10px 11px; border:1px solid #d9deea; border-radius:10px;
    background:#fff; color:var(--text); font:inherit; margin-bottom:13px;
  }
  textarea { min-height:76px; resize:vertical; }
  button {
    border:0; border-radius:10px; padding:10px 14px; font:inherit; font-weight:650;
    cursor:pointer; background:var(--accent); color:white;
  }
  button.secondary { background:#eef0f6; color:var(--text); }
  button.danger { background:#fee2e2; color:var(--danger); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .section-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
  .section-head h2 { margin:0; font-size:19px; }
  .filters { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:9px; margin-bottom:14px; }
  .filters input,.filters select { margin:0; }
  .expense {
    display:grid; grid-template-columns:105px 1fr auto; gap:14px; align-items:center;
    padding:14px 0; border-top:1px solid var(--border);
  }
  .expense:first-child { border-top:0; }
  .date { color:var(--muted); font-size:13px; }
  .desc { font-weight:700; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .amount { font-weight:750; text-align:right; white-space:nowrap; }
  .expense-actions { margin-top:7px; display:flex; justify-content:flex-end; gap:5px; }
  .expense-actions button { padding:5px 8px; font-size:12px; }
  .empty { text-align:center; color:var(--muted); padding:35px 10px; }
  .summary { margin-top:18px; }
  .category-row { display:grid; grid-template-columns:110px 1fr 110px; gap:10px; align-items:center; margin:10px 0; font-size:13px; }
  .bar { height:8px; background:#edf0f5; border-radius:99px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .right { min-width:0; }
  .small { font-size:12px; color:var(--muted); }
  @media (max-width:800px) {
    .grid { grid-template-columns:1fr; }
    .layout { grid-template-columns:1fr; }
  }
  @media (max-width:560px) {
    .container { padding:18px 12px 35px; }
    .header { align-items:flex-start; flex-direction:column; }
    .filters { grid-template-columns:1fr; }
    .expense { grid-template-columns:75px 1fr; }
    .amount { grid-column:2; text-align:left; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>💸 My Expense Log</h1>
      <div class="subtitle">Ghi lại tiền đã chi và xem tổng theo ngày, tuần, tháng.</div>
    </div>
    <button class="secondary" id="clearAllBtn">Xóa tất cả</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="stat-label">Hôm nay</div>
      <div class="stat-value" id="todayTotal">0 ₫</div>
    </div>
    <div class="card">
      <div class="stat-label">Tuần này</div>
      <div class="stat-value" id="weekTotal">0 ₫</div>
    </div>
    <div class="card">
      <div class="stat-label">Tháng này</div>
      <div class="stat-value" id="monthTotal">0 ₫</div>
    </div>
  </div>

  <div class="layout">
    <div class="card">
      <h2 id="formTitle">➕ Thêm khoản chi</h2>
      <form id="expenseForm">
        <input type="hidden" id="editId">
        <label for="date">Ngày</label>
        <input type="date" id="date" required>

        <label for="amount">Số tiền (₫)</label>
        <input type="number" id="amount" min="0" step="1000" placeholder="Ví dụ: 80000" required>

        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Other</option>
        </select>

        <label for="description">Nội dung</label>
        <input type="text" id="description" placeholder="Ví dụ: Ăn trưa" required>

        <label for="note">Note (optional)</label>
        <textarea id="note" placeholder="Ghi chú thêm..."></textarea>

        <div class="actions">
          <button type="submit" id="saveBtn">Lưu khoản chi</button>
          <button type="button" class="secondary" id="cancelBtn" style="display:none">Hủy sửa</button>
        </div>
      </form>
      <div class="small" style="margin-top:14px;">Dữ liệu V1 được lưu ngay trên trình duyệt này.</div>
    </div>

    <div class="right">
      <div class="card">
        <div class="section-head">
          <h2>📋 Các khoản đã chi</h2>
          <span class="small" id="resultCount">0 khoản</span>
        </div>

        <div class="filters">
          <input type="date" id="filterDate">
          <select id="filterCategory">
            <option value="all">Tất cả category</option>
            <option>Food</option><option>Transport</option><option>Shopping</option>
            <option>Bills</option><option>Entertainment</option><option>Health</option><option>Other</option>
          </select>
          <input type="text" id="search" placeholder="🔎 Tìm nội dung...">
        </div>

        <div id="expenseList"></div>
      </div>

      <div class="card summary">
        <div class="section-head">
          <h2>📊 Chi theo category — tháng này</h2>
        </div>
        <div id="categorySummary"></div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "my_expense_log_v1";
let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

const $ = id => document.getElementById(id);

function localDateString(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatMoney(n) {
  return new Intl.NumberFormat("vi-VN").format(Number(n) || 0) + " ₫";
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
}

function parseDate(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y,m-1,d);
}

function startOfWeek(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  const day = x.getDay(); // Sun=0
  const diff = day === 0 ? -6 : 1-day; // Monday start
  x.setDate(x.getDate()+diff);
  return x;
}

function sameDay(dateString, d) {
  return dateString === localDateString(d);
}

function inCurrentWeek(dateString) {
  const d = parseDate(dateString);
  const start = startOfWeek(new Date());
  const end = new Date(start);
  end.setDate(end.getDate()+7);
  return d >= start && d < end;
}

function inCurrentMonth(dateString) {
  const d = parseDate(dateString);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function resetForm() {
  $("expenseForm").reset();
  $("date").value = localDateString();
  $("editId").value = "";
  $("formTitle").textContent = "➕ Thêm khoản chi";
  $("saveBtn").textContent = "Lưu khoản chi";
  $("cancelBtn").style.display = "none";
}

function renderStats() {
  const now = new Date();
  const today = expenses.filter(e => sameDay(e.date, now)).reduce((s,e)=>s+Number(e.amount),0);
  const week = expenses.filter(e => inCurrentWeek(e.date)).reduce((s,e)=>s+Number(e.amount),0);
  const month = expenses.filter(e => inCurrentMonth(e.date)).reduce((s,e)=>s+Number(e.amount),0);
  $("todayTotal").textContent = formatMoney(today);
  $("weekTotal").textContent = formatMoney(week);
  $("monthTotal").textContent = formatMoney(month);
}

function renderList() {
  const date = $("filterDate").value;
  const category = $("filterCategory").value;
  const search = $("search").value.trim().toLowerCase();

  let list = expenses.filter(e => {
    if (date && e.date !== date) return false;
    if (category !== "all" && e.category !== category) return false;
    if (search && !(e.description+" "+(e.note||"")).toLowerCase().includes(search)) return false;
    return true;
  });

  list.sort((a,b) => b.date.localeCompare(a.date) || Number(b.createdAt)-Number(a.createdAt));
  $("resultCount").textContent = `${list.length} khoản`;

  if (!list.length) {
    $("expenseList").innerHTML = `<div class="empty">Chưa có khoản chi phù hợp.</div>`;
    return;
  }

  $("expenseList").innerHTML = list.map(e => `
    <div class="expense">
      <div class="date">${formatDate(e.date)}</div>
      <div>
        <div class="desc">${escapeHtml(e.description)}</div>
        <div class="meta">${escapeHtml(e.category)}${e.note ? " · "+escapeHtml(e.note) : ""}</div>
      </div>
      <div>
        <div class="amount">${formatMoney(e.amount)}</div>
        <div class="expense-actions">
          <button class="secondary" onclick="editExpense('${e.id}')">Sửa</button>
          <button class="danger" onclick="deleteExpense('${e.id}')">Xóa</button>
        </div>
      </div>
    </div>
  `).join("");
}

function renderCategorySummary() {
  const month = expenses.filter(e => inCurrentMonth(e.date));
  const totals = {};
  month.forEach(e => totals[e.category] = (totals[e.category] || 0) + Number(e.amount));
  const total = month.reduce((s,e)=>s+Number(e.amount),0);

  if (!total) {
    $("categorySummary").innerHTML = `<div class="empty">Chưa có dữ liệu tháng này.</div>`;
    return;
  }

  const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  $("categorySummary").innerHTML = rows.map(([cat,value]) => {
    const pct = total ? value/total*100 : 0;
    return `<div class="category-row">
      <div>${escapeHtml(cat)}</div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div style="text-align:right">${formatMoney(value)}</div>
    </div>`;
  }).join("");
}

function formatDate(s) {
  const [y,m,d] = s.split("-");
  return `${d}/${m}/${y}`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render() {
  renderStats();
  renderList();
  renderCategorySummary();
}

$("expenseForm").addEventListener("submit", e => {
  e.preventDefault();
  const id = $("editId").value;
  const data = {
    date: $("date").value,
    amount: Number($("amount").value),
    category: $("category").value,
    description: $("description").value.trim(),
    note: $("note").value.trim()
  };

  if (!data.date || !data.amount || data.amount < 0 || !data.description) return;

  if (id) {
    const idx = expenses.findIndex(e => e.id === id);
    if (idx >= 0) expenses[idx] = {...expenses[idx], ...data};
  } else {
    expenses.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
      ...data,
      createdAt: Date.now()
    });
  }

  save();
  resetForm();
  render();
});

window.editExpense = function(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  $("editId").value = e.id;
  $("date").value = e.date;
  $("amount").value = e.amount;
  $("category").value = e.category;
  $("description").value = e.description;
  $("note").value = e.note || "";
  $("formTitle").textContent = "✏️ Sửa khoản chi";
  $("saveBtn").textContent = "Cập nhật";
  $("cancelBtn").style.display = "inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.deleteExpense = function(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  if (!confirm(`Xóa khoản "${e.description}" — ${formatMoney(e.amount)}?`)) return;
  expenses = expenses.filter(x => x.id !== id);
  save();
  render();
};

$("cancelBtn").addEventListener("click", resetForm);

$("clearAllBtn").addEventListener("click", () => {
  if (!expenses.length) return;
  if (!confirm("Xóa toàn bộ dữ liệu chi tiêu? Hành động này không thể hoàn tác.")) return;
  expenses = [];
  save();
  resetForm();
  render();
});

["filterDate","filterCategory","search"].forEach(id => {
  $(id).addEventListener("input", renderList);
  $(id).addEventListener("change", renderList);
});

$("date").value = localDateString();
render();
</script>
</body>
</html>
